name: roxo_shop
description: Roxo Shop - loja, atalhos de alertas V-Bucks e minha conta.
publish_to: none
version: 0.4.0+4
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ^7.0.0
  url_launcher: ^6.3.2
  webview_flutter: ^4.13.0
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true
  assets:
    - assets/images/icon.png
    - assets/images/banner.png
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/icon.png
  adaptive_icon_background: '#09090F'
  adaptive_icon_foreground: assets/images/icon.png
